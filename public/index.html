<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가족 여행지 지도</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body data-editing="false">

  <!-- 헤더 -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-logo">🗺️</span>
      <h1 class="app-title">가족 여행지 지도</h1>
    </div>
    <div class="header-right">
      <span id="sync-status" role="status" aria-live="polite"></span>
      <button id="btn-sync" class="btn btn-ghost">새로고침</button>
      <button id="btn-edit-mode" class="btn btn-ghost" aria-pressed="false" title="편집 잠금 해제" aria-label="편집 잠금 해제">🔒</button>
      <button id="btn-migrate" class="btn btn-ghost" data-edit-only hidden>기존 데이터 공유</button>
      <button data-edit-only id="btn-add-group" class="btn btn-primary">+ 그룹 추가</button>
      <button id="btn-export" class="btn btn-ghost">📤 내보내기</button>
      <label data-edit-only class="btn btn-ghost" style="cursor:pointer;">
        📥 가져오기
        <input type="file" id="btn-import-file" accept=".json" style="display:none;" />
      </label>
    </div>
  </header>
  <!-- 메인 레이아웃 -->
  <main class="app-layout">

    <!-- 좌측: 여행 그룹 목록 -->
    <aside class="panel panel-groups" id="panel-groups">
      <div class="panel-header">
        <span class="panel-title">여행 그룹</span>
        <button id="btn-toggle-groups" class="btn-icon panel-toggle" aria-controls="group-content" aria-expanded="true" aria-label="여행 그룹 접기" title="여행 그룹 접기">⇆</button>
      </div>
      <div class="panel-content" id="group-content">
      <ul class="group-list" id="group-list">
        <!-- JS로 렌더링 -->
      </ul>
      </div>
    </aside>

    <!-- 중앙: 장소 목록 -->
    <aside class="panel panel-places" id="panel-places">
      <div class="panel-header">
        <span class="panel-title" id="current-group-name">그룹을 선택하세요</span>
        <button data-edit-only id="btn-add-place" class="btn btn-sm btn-primary" style="display:none;">+ 장소</button>
        <button id="btn-toggle-places" class="btn-icon panel-toggle" aria-controls="place-content" aria-expanded="true" aria-label="장소 목록 접기" title="장소 목록 접기">⇆</button>
      </div>
      <div class="panel-content" id="place-content">
      <!-- 필터 -->
      <div class="filter-bar" id="filter-bar" style="display:none;">
        <select id="filter-category" class="filter-select">
          <option value="">전체 카테고리</option>
          <option>맛집</option>
          <option>관광지</option>
          <option>숙소</option>
          <option>체험/액티비티</option>
          <option>카페/디저트</option>
          <option>쇼핑</option>
          <option>기타</option>
        </select>
        <input type="text" id="filter-tag" class="filter-input" placeholder="태그 검색 (#바다)" />
      </div>
      <ul class="place-list" id="place-list">
        <!-- JS로 렌더링 -->
      </ul>
      </div>
    </aside>

    <!-- 우측: 지도 -->
    <section class="map-container" id="map-container">
      <div id="map" hidden></div>
      <div id="map-placeholder" class="map-placeholder"><button id="btn-load-map" class="btn btn-primary">지도 보기</button></div>
    </section>

  </main>

  <!-- 모바일 하단 탭 -->
  <nav class="mobile-tab-bar">
    <button class="tab-btn active" id="mobile-tab-map" data-tab="map">🗺️ 지도</button>
    <button class="tab-btn" id="mobile-tab-list" data-tab="list">📍 목록</button>
    <button class="tab-btn" id="mobile-tab-groups" data-tab="groups">🗂️ 그룹</button>
  </nav>

  <!-- 모달 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box" id="modal-content">
      <!-- JS로 동적 삽입 -->
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast" id="toast"></div>

  <!-- config.js: APP_CONFIG 설정 (non-module, 먼저 로드) -->
  <script src="/js/config.js"></script>

  <script type="module">
    import { App } from '/js/app.js';
    App.init();
  </script>

</body>
</html>
